<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Digit Duel is a Supabase-powered multiplayer number guessing game."
    />
    <script>
      ;(() => {
        const { location } = window

        if (!location.search.startsWith('?/')) {
          return
        }

        const decodedPath = location.search
          .slice(2)
          .split('&')
          .map((segment) => segment.replace(/~and~/g, '&'))
          .join('?')

        window.history.replaceState(
          null,
          '',
          `${location.pathname}${decodedPath}${location.hash}`,
        )
      })()
    </script>
    <title>Digit Duel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
